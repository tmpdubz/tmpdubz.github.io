{{ define "main" }}
<article class="resume-page">
  <header class="resume-header">
    <p class="eyebrow screen-only">Experience &amp; background</p>
    <h1>{{ .Site.Params.Author.name }}</h1>
    <p class="resume-role">Site Reliability Engineer</p>
    <nav class="resume-contact" aria-label="Contact information">
      <a href="mailto:{{ .Site.Params.Author.email }}">{{ .Site.Params.Author.email }}</a>
      <a href="https://www.linkedin.com/in/tmpdubz/">LinkedIn</a>
      <a href="https://github.com/tmpdubz">GitHub</a>
      <a class="print-only" href="https://tdubiel.dev">tdubiel.dev</a>
    </nav>
    <div class="resume-actions screen-only">
      <a class="primary-link" href="{{ "Tomasz-Dubiel-CV.pdf" | relURL }}" download>Download CV <span class="file-type">PDF</span></a>
      <button type="button" id="print-resume">Print / save as PDF</button>
    </div>
  </header>
  <div class="resume-content prose dark:prose-invert">{{ .Content }}</div>
</article>
{{ $script := resources.Get "js/resume.js" | minify | fingerprint }}
<script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
{{ end }}
