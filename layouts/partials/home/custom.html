<article class="profile-home">
  <header class="profile-intro">
    {{ with resources.Get .Site.Params.Author.image }}
      {{ $portrait := .Resize "640x webp q85" }}
      <img class="profile-portrait nozoom" src="{{ $portrait.RelPermalink }}"
        alt="Illustrated portrait of Tomasz Dubiel in a cap and sunglasses"
        width="{{ $portrait.Width }}" height="{{ $portrait.Height }}" fetchpriority="high">
    {{ end }}
    <div class="profile-intro-copy">
    <p class="eyebrow">I do it four the nines.</p>
    <h1>Tomasz Dubiel</h1>
    <p class="profile-role">Site Reliability Engineer at Shopify</p>
    <div class="profile-description">{{ .Content }}</div>
    <div class="profile-actions" aria-label="Profile links">
      <a class="primary-link" href="{{ "resume/" | relURL }}">View CV <span aria-hidden="true">↗</span></a>
      <a href="https://www.linkedin.com/in/tmpdubz/">LinkedIn</a>
      <a href="mailto:{{ .Site.Params.Author.email }}">Email me</a>
    </div>
    </div>
  </header>
</article>
