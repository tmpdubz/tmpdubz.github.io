name: Check Hugo Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check downloadable CV
        run: |
          python3 scripts/export-cv.py
          git diff --exit-code -- static/Tomasz-Dubiel-CV.pdf

      - name: Build site with pinned Hugo
        run: |
          nix run .#hugo -- --minify
